
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgotten Lands</title>

    <link href="./dist/output.css" rel="stylesheet">
</head>

<body class="min-h-screen text-violet-100">

    <!-- BACKGROUND IMAGE -->
    <div class="pointer-events-none fixed inset-0 z-0">

        <img
            src="./assets/background-placeholder.jpg"
            alt=""
            class="h-full w-full object-cover object-center"
        >

    </div>


    <!-- MAIN CONTENT -->
    <main class="relative z-10 mx-auto flex min-h-screen w-full max-w-6xl flex-col px-6 py-8">

        <!-- HEADER -->
        <header class="flex flex-col items-start justify-between gap-2 border-b border-violet-400/30 pb-5 sm:flex-row sm:items-center">

            <p class="text-xs uppercase tracking-[0.3em] text-violet-300">
                A Medieval Fantasy Adventure
            </p>

            <p class="text-xs uppercase tracking-widest text-violet-200/70">
                The Island Has Fallen
            </p>

        </header>


        <!-- HERO SECTION -->
        <section class="flex flex-1 flex-col items-center justify-center py-20 text-center">

            <p class="mb-4 text-sm uppercase tracking-[0.3em] text-violet-400">
                An RPG Adventure
            </p>

            <h1 class="text-4xl font-bold tracking-[0.15em] text-violet-100 drop-shadow-lg sm:text-6xl">
                FORGOTTEN LANDS
            </h1>

            <p class="mt-6 max-w-xl text-sm leading-relaxed text-violet-200/80 sm:text-base">
                An island consumed by dark magic.
                Your journey begins behind prison walls.
            </p>


            <!-- MAIN MENU -->
            <nav aria-label="Main menu" class="mt-12 flex w-full max-w-xs flex-col gap-4">

                <!-- PLAY BUTTON -->
                <button
                    type="button"
                    class="border border-violet-300/70 bg-violet-800/90 px-8 py-4 text-sm font-bold uppercase tracking-[0.2em] text-violet-50 shadow-lg shadow-purple-950/50 transition-colors hover:bg-violet-600 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-violet-300"
                >
                    Play
                </button>


                <!-- SETTINGS BUTTON -->
                <button
                    type="button"
                    class="border border-violet-400/60 bg-purple-950/50 px-8 py-4 text-sm font-bold uppercase tracking-[0.2em] text-violet-200 transition-colors hover:border-violet-300 hover:bg-violet-900/70 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-violet-300"
                >
                    Settings
                </button>


                <!-- LOGIN BUTTON -->
                <button
                    type="button"
                    class="border border-violet-400/60 bg-purple-950/50 px-8 py-4 text-sm font-bold uppercase tracking-[0.2em] text-violet-200 transition-colors hover:border-violet-300 hover:bg-violet-900/70 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-violet-300"
                >
                    Login / Create Account
                </button>

            </nav>

        </section>


        <!-- FOOTER -->
        <footer class="border-t border-violet-400/30 pt-5 text-center">

            <p class="text-xs tracking-widest text-violet-300/60">
                TURN-BASED RPG · PIXEL ART ADVENTURE
            </p>

        </footer>

    </main>

</body>

</html>
